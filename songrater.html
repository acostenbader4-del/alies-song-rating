<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Song Ratings</title>

  <style>
  :root {
    --bg: #0f0f12;
    --card: #1a1a1f;
    --text: #f5f5f5;
    --muted: #cfcfcf;
    --accent: #ff8c1a;
    --accent-dark: #e67600;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* Main card */
  #ratingScreen,
  #resultsScreen {
    background-color: var(--card);
    width: 100%;
    max-width: 500px;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  h2 {
    font-size: 1.8rem;
    margin-bottom: 20px;
    text-align: center;
    line-height: 1.3;
  }

  .category {
    margin-bottom: 22px;
  }

  .category > div:first-child {
    font-size: 1.2rem;
    margin-bottom: 8px;
    color: var(--muted);
  }

  /* Rating buttons */
  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .buttons button {
    flex: 1 0 18%;
    min-width: 48px;
    padding: 14px 0;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 10px;
    border: none;
    background-color: #2a2a30;
    color: var(--text);
    cursor: pointer;
  }

  .buttons button.selected {
    background-color: var(--accent);
    color: #000;
  }

  .buttons button:active {
    transform: scale(0.96);
  }

  /* Main navigation buttons */
  button.main {
    width: 100%;
    padding: 16px;
    margin-top: 16px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    background-color: var(--accent);
    color: #000;
  }

  button.main:hover {
    background-color: var(--accent-dark);
  }

  .hidden {
    display: none;
  }

  /* Results */
  .result {
    font-size: 1.1rem;
    padding: 10px;
    margin-bottom: 10px;
    background-color: #26262c;
    border-radius: 10px;
  }

  /* Desktop polish */
  @media (min-width: 768px) {
    h2 {
      font-size: 2rem;
    }

    .buttons button {
      font-size: 1.2rem;
    }

    button.main {
      font-size: 1.3rem;
    }
  }
</style>


  
</head>

<!-- RATING SCREEN -->

  <div id="categories"></div>

  <button class="main" onclick="nextSong()">Next Song</button>
  <button class="main" onclick="showResults()">View Results</button>
</div>

  const songs = songText.trim().split("\n");

  const categories = [
    "Sing-Along",
    "Danceability",
    "Catchiness",
    "Emotional Impact",
    "Lyrics Quality",
    "Playlist Potential"
  ];

  let currentIndex = 0;
  let currentRatings = {};
  let results = [];

  function renderSong() {
    if (currentIndex >= songs.length) {
      showResults();
      return;
    }

    document.getElementById("songTitle").textContent =
      `${songs[currentIndex]} (${currentIndex + 1} / ${songs.length})`;

    const container = document.getElementById("categories");
    container.innerHTML = "";
    currentRatings = {};

    categories.forEach(cat => {
      const div = document.createElement("div");
      div.className = "category";

      const label = document.createElement("div");
      label.textContent = cat;

      const buttonsDiv = document.createElement("div");
      buttonsDiv.className = "buttons";

      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.onclick = () => {
          currentRatings[cat] = i;
          [...buttonsDiv.children].forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
        };
        buttonsDiv.appendChild(btn);
      }

      div.appendChild(label);
      div.appendChild(buttonsDiv);
      container.appendChild(div);
    });
  }

  function nextSong() {
    if (Object.keys(currentRatings).length !== categories.length) {
      alert("Please rate all categories.");
      return;
    }

    const total = Object.values(currentRatings)
      .reduce((sum, val) => sum + Number(val), 0);

    results.push({
      song: songs[currentIndex],
      ratings: currentRatings,
      total: total
    });

    currentIndex++;
    renderSong();
  }

  function showResults() {
    document.getElementById("ratingScreen").classList.add("hidden");
    document.getElementById("resultsScreen").classList.remove("hidden");

    const list = document.getElementById("resultsList");
    list.innerHTML = "";

    const ranked = [...results].sort((a, b) => b.total - a.total);

    ranked.forEach((entry, index) => {
      const div = document.createElement("div");
      div.className = "result";
      div.textContent = `${index + 1}. ${entry.song} — Total: ${entry.total}`;
      list.appendChild(div);
    });
  }

  function returnToRatings() {
    document.getElementById("resultsScreen").classList.add("hidden");
    document.getElementById("ratingScreen").classList.remove("hidden");
  }

  function generatePDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 10;

    doc.setFontSize(12);
    doc.text("Song Rankings", 10, y);
    y += 10;

    const ranked = [...results].sort((a, b) => b.total - a.total);

    ranked.forEach((entry, index) => {
      doc.text(`${index + 1}. ${entry.song} — Total: ${entry.total}`, 10, y);
      y += 6;

      for (const cat in entry.ratings) {
        doc.text(`   ${cat}: ${entry.ratings[cat]}`, 10, y);
        y += 5;
      }

      y += 4;
      if (y > 270) {
        doc.addPage();
        y = 10;
      }
    });

    doc.save("song-ratings-results.pdf");
  }

  renderSong();
</script>
